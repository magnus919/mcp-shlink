name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format . --check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Type check
        run: mypy src/

  code-quality:
    name: Code Quality (dead code, complexity, dependencies, duplication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install quality tooling
        run: pip install vulture xenon deptry
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Dead code detection (vulture)
        run: vulture src
      - name: Complexity gate (xenon)
        run: xenon src --max-absolute B --max-average A --max-modules B
      - name: Unused dependency detection (deptry)
        run: deptry src
      - name: Duplicate code detection (jscpd)
        run: |
          mkdir -p reports
          jscpd src --reporters json --output reports --min-tokens 50 --threshold 0.1 --silent
          DUPLICATES=$(jq '.statistics.total.clones' reports/jscpd-report.json)
          PERCENT=$(jq '.statistics.total.percentage' reports/jscpd-report.json)
          echo "jscpd: ${DUPLICATES} clone groups, ${PERCENT}% duplication (threshold 0.1%)"
          awk -v p="$PERCENT" 'BEGIN { exit (p+0 > 0.1) ? 1 : 0 }' || {
            echo "::error::Duplication ${PERCENT}% exceeds 0.1% threshold"; exit 1; }
      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-report
          path: reports/jscpd-report.json
          retention-days: 14

  file-size:
    name: File Size Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check for oversized files
        run: python scripts/check_file_size.py

  test:
    name: Test (coverage, xdist, random order)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage gate
        run: pytest --cov-report=xml --durations=10 --junitxml=pytest-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            coverage.xml
          retention-days: 14

  docs-freshness:
    name: Docs Freshness & AGENTS.md Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install package
        run: pip install -e .
      - name: Validate AGENTS.md against pyproject and config
        run: python scripts/check_agents_md.py
      - name: Fail if key docs are stale (>180 days)
        run: |
          STALE=$(git log -1 --since="180 days ago" --format=%H -- README.md AGENTS.md CONTRIBUTING.md || true)
          if [ -z "$STALE" ]; then
            echo "::error::README.md/AGENTS.md/CONTRIBUTING.md have not been updated in 180 days"
            exit 1
          fi
          echo "Docs are fresh (last key-doc commit: $STALE)"

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh -s -- -b /usr/local/bin
          gitleaks detect --source . --verbose --redact

  architecture-diagram:
    name: Architecture Diagram Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate and verify architecture diagram
        run: |
          pip install -e .
          python scripts/generate_architecture_diagram.py --check
